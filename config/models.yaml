# Which providers hivemind may run agents on, and which models serve each role.
# Changing a model is an edit here and a restart; no code names a provider or a
# model id. `hivemind preflight` checks every id against the model runtime and,
# with --probe, spends one tiny request per candidate, because a model id that
# exists is not always one this account may use (a ChatGPT subscription rejects
# ids pi still lists).
#
# Order is the failover order. Budgets count every provider at its
# API-equivalent price, subscriptions included, so order is about capability
# first and price second, never about "free".

# A provider with apiKeyEnv takes its key from that secret in the secrets file;
# one without it takes a login pi keeps in its own auth file.
providers:
  # ChatGPT subscription; the login lives in ~/.pi/agent/auth.json.
  openai-codex:
    billing: subscription

  # Monthly plan with a credit allowance and no overage.
  command-code:
    billing: subscription
    apiKeyEnv: COMMAND_CODE_API_KEY
    declaration:
      baseUrl: https://api.commandcode.ai/provider/v1
      api: openai-completions
      models:
        - id: deepseek/deepseek-v4.1-flash
          name: DeepSeek V4.1 Flash (Command Code)
          reasoning: true
          input: [text, image]
          contextWindow: 1000000
          maxTokens: 65536
          thinkingLevelMap: { minimal: null, low: null, medium: null, high: high, max: max }
          cost: { input: 0.15, output: 0.6, cacheRead: 0.003, cacheWrite: 0 }
        - id: z-ai/glm-5.3-flash
          name: GLM-5.3 Flash (Command Code)
          reasoning: true
          input: [text, image]
          contextWindow: 1048576
          maxTokens: 131072
          thinkingLevelMap: { minimal: null, low: low, medium: null, high: high, max: max }
          cost: { input: 0.15, output: 0.5, cacheRead: 0.03, cacheWrite: 0 }

  xiaomi:
    billing: metered
    apiKeyEnv: MIMO_API_KEY

  deepseek:
    billing: metered
    apiKeyEnv: DEEPSEEK_API_KEY

roles:
  # Reads a person's words and turns them into a product contract, an
  # architecture and a plan. The most capable model leads.
  planner:
    - { provider: openai-codex, model: gpt-5.6-sol, effort: high }
    - { provider: command-code, model: deepseek/deepseek-v4.1-flash, effort: high }
    - { provider: xiaomi, model: mimo-v2.6-flash, effort: high }
    - { provider: deepseek, model: deepseek-flash, effort: high }

  # Implements one plan item test-first.
  builder:
    - { provider: command-code, model: deepseek/deepseek-v4.1-flash, effort: high }
    - { provider: openai-codex, model: gpt-5.6-terra, effort: medium }
    - { provider: xiaomi, model: mimo-v2.6-flash, effort: high }
    - { provider: deepseek, model: deepseek-flash, effort: high }

  # Drives the running product like a person and judges each scenario.
  evaluator:
    - { provider: openai-codex, model: gpt-5.6-sol, effort: medium }
    - { provider: command-code, model: deepseek/deepseek-v4.1-flash, effort: high }
    - { provider: xiaomi, model: mimo-v2.6-flash, effort: high }
    - { provider: deepseek, model: deepseek-flash, effort: high }
