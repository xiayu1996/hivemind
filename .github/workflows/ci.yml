name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      # The evaluator's browser and the loop tests drive a real headless Chromium.
      - run: npx playwright install --with-deps chromium
      - run: npm run lint
      - run: npm run typecheck
      # The migrations must be exactly what the schema generates.
      - run: npm run db:check
      - run: npm test
